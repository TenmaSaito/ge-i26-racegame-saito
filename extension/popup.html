<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    width: 340px;
    margin: 0;
    padding: 12px 14px 14px;
    background: #0e2233;
    color: #eaf4fb;
  }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { font-size: 11px; color: #9db8cc; margin-bottom: 10px; }
  .row { margin: 9px 0; }
  .row label { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 3px; }
  .row label .val { font-variant-numeric: tabular-nums; color: #ffd97a; }
  .row .desc { font-size: 10.5px; color: #9db8cc; margin-top: 2px; }
  input[type="range"] { width: 100%; accent-color: #38b6e8; }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; padding: 7px 0; font-size: 12.5px; border: 0; border-radius: 6px;
    background: #1d4e6b; color: #eaf4fb; cursor: pointer;
  }
  button:hover { background: #27688f; }
  #status { font-size: 11.5px; margin-top: 10px; min-height: 16px; color: #8fe3a8; }
  #status.err { color: #ff9d8a; }
</style>
</head>
<body>
<h1>ドリフト調整</h1>
<div class="sub">ブラウザ版 racegame 用。ゲームのタブを開いた状態で使ってください。変更は走行中でも即時反映されます。</div>
<div id="items"></div>
<div class="buttons">
  <button id="reload">読み直す</button>
  <button id="defaults">初期値に戻す</button>
</div>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
